[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/melview"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
required-version = ">=0.17.5"
# Home Assistant 2025.8, the minimum in hacs.json, runs on Python 3.13
target-version = "py313"

[tool.ruff.lint]
# Rule set of Home Assistant core (home-assistant/core pyproject.toml, November 2026)
